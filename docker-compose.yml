# Caps every container's own stdout/stderr log file so it can never fill
# the disk on its own -- Docker's json-file driver has no size limit by
# default, and a noisy or crashlooping container can otherwise grow
# unbounded indefinitely. 10MB x 3 files per container is generous for
# debugging while keeping a worst case (every one of ~30 services at the
# cap simultaneously) well under a gigabyte total.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Single source of truth for DATABASE_URL, merged into each service's own
# environment block below via YAML's `<<:` merge key -- avoids repeating
# this exact connection-string template ~20 times. DB_PASSWORD itself
# stays the one secret an operator actually sets (README's install
# script generates it), this just assembles the DSN from it in one place.
x-env-defaults: &env-defaults
  DATABASE_URL: postgres://kubewatch:${DB_PASSWORD}@postgres:5432/kubewatch?sslmode=require

# Every Mimir component (distributor/ingester/querier/query-frontend/
# query-scheduler/compactor/store-gateway, defined further down) shares this
# same image + mimir.yaml mount + MinIO credentials, differing only in
# `-target=<component>` on its own `command:` -- avoids repeating
# image/logging/security_opt/environment/volumes/depends_on/restart 7 times.
# Merged into each mimir-* service below via YAML's `<<:` merge key (same
# pattern as x-env-defaults above); a service's own `command:`, and for the
# 3 stateful ones its own extra data volume, are additions alongside this
# anchor, never overridden by it.
#
# MIMIR_S3_* point at the bundled minio service below by default.
# docker-compose.saas.yml's mimir-* overlay replaces all three (plus
# MIMIR_S3_INSECURE) to point at real AWS S3 instead -- see mimir.yaml's own
# header comment.
#
# depends_on's `required: false` matters even for THIS file alone: minio-init
# below is gated behind the "selfhost-storage" profile (see its own comment
# for why and how that profile gets activated), which is inactive by
# default. Without `required: false`, `docker compose -f
# docker-compose.selfhost.yml config` would refuse to resolve at all
# whenever that profile isn't active ("service ... depends on undefined
# service minio-init") -- verified empirically. With it, an inactive profile
# just means minio-init is treated as absent (Compose skips the wait); when
# the profile IS active, `required: false` has no effect on ordering --
# every mimir-* component still waits for minio-init to actually complete
# before starting, exactly as if it were required. docker-compose.saas.yml's
# overlay goes further still (depends_on: !reset {}), since SaaS never runs
# minio at all regardless of whether that profile happens to be active in
# its own environment.
x-mimir-common: &mimir-common
  logging: *default-logging
  security_opt:
    - "no-new-privileges:true"
  image: grafana/mimir:latest
  environment:
    MIMIR_S3_ENDPOINT: minio:9000
    MIMIR_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
    MIMIR_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  volumes:
    - ./mimir.yaml:/etc/mimir/mimir.yaml:ro
  depends_on:
    minio-init:
      condition: service_completed_successfully
      required: false
  restart: unless-stopped

# Every Loki component (distributor/ingester/querier/query-frontend/
# query-scheduler/compactor/index-gateway, defined further down) shares
# this same image + loki.yaml mount + MinIO credentials, differing only in
# `-target=<component>` on its own `command:` -- same shape as
# x-mimir-common above. LOKI_S3_INSECURE/LOKI_S3_FORCE_PATH_STYLE point at
# the bundled MinIO (plain HTTP, path-style bucket addressing) by default;
# docker-compose.saas.yml's loki-* overlay replaces all five (S3 endpoint/
# credentials plus both flags) to point at real AWS S3 instead -- see
# loki.yaml's own header comment for why these two flags are pushed in
# from here rather than templated with an in-file default the way Mimir's
# MIMIR_S3_INSECURE is.
#
# depends_on's `required: false` matters here for the same reason as
# x-mimir-common's own comment above -- minio-init is gated behind the
# "selfhost-storage" profile, inactive by default.
x-loki-common: &loki-common
  logging: *default-logging
  security_opt:
    - "no-new-privileges:true"
  image: grafana/loki:3.1.1
  environment:
    LOKI_S3_ENDPOINT: minio:9000
    LOKI_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
    LOKI_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    LOKI_S3_INSECURE: "true"
    LOKI_S3_FORCE_PATH_STYLE: "true"
  volumes:
    - ./loki.yaml:/etc/loki/loki.yaml:ro
  depends_on:
    minio-init:
      condition: service_completed_successfully
      required: false
  restart: unless-stopped

services:
  caddy:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: public.ecr.aws/docker/library/caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - gateway

  gateway:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-gateway:latest
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      GATEWAY_PORT: "8000"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      AUTH_SERVICE_URL: http://auth:8001
      INGESTION_SERVICE_URL: http://ingestion:8002
      QUERY_SERVICE_URL: http://query:8003
      LIVE_DATA_SERVICE_URL: http://live-data:8009
      CLUSTERS_SERVICE_URL: http://clusters:8008
      INCIDENTS_SERVICE_URL: http://incidents:8013
      PIPELINES_SERVICE_URL: http://pipelines:8017
      SYNTHETICS_SERVICE_URL: http://synthetics:8025
      EXPORT_TARGETS_SERVICE_URL: http://export-targets:8026
      WEBHOOK_GATEWAY_SERVICE_URL: http://webhook-gateway:8018
      IAC_SERVICE_URL: http://iac:8019
      CREDENTIALS_SERVICE_URL: http://credentials:8024
      # Only route proxied here is the public marketing-email unsubscribe link
      # (/api/v1/email/unsubscribe); everything else notification does is
      # NATS-driven or internal-only.
      NOTIFICATION_SERVICE_URL: http://notification:8007
      CLOUD_SERVICE_URL: http://cloud:8010
      DATAOPS_SERVICE_URL: http://dataops:8021
      ANALYTICS_SERVICE_URL: http://analytics:8022
      DEVOPS_AGENT_SERVICE_URL: http://devops-agent:8023
      INTEGRATIONS_SERVICE_URL: http://integrations:8011
      JWT_SECRET: ${JWT_SECRET}
      KUBEWATCH_LICENSE_KEY: ${KUBEWATCH_LICENSE_KEY:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      # License server the gateway asks to mint keys for POST
      # /api/v1/admin/license/generate-dev. Fed from LICENSE_SERVER_URL — the one
      # name every other service in this repo already uses for the same target
      # (query, billing, and the Helm ConfigMap) — so the two stacks that share
      # this file each get the right thing without a second variable to keep in
      # sync: a SaaS host (this file + docker-compose.saas.yml) has
      # LICENSE_SERVER_URL=http://license:8012 in its .env and reaches the
      # co-located license container, while a plain self-hosted install has no
      # license container at all and correctly falls back to the public server.
      # Previously unset, so the gateway silently used its in-code default
      # regardless of deployment.
      LICENSE_SERVICE_URL: ${LICENSE_SERVER_URL:-https://licenses.kubewatchlabs.com}
      # Admin token for the above. Passed through, never generated by
      # install.sh (unlike JWT_SECRET/DB_PASSWORD/IAC_VAULT_MASTER_KEY, which the
      # install owns both ends of): this authenticates against whichever license
      # server LICENSE_SERVICE_URL points at, so only that server's operator can
      # supply a valid value. Left empty on a normal self-hosted install, where
      # generate-dev then refuses with an explicit "not configured" rather than
      # issuing a request that could never be authorized.
      LICENSE_ADMIN_TOKEN: ${LICENSE_ADMIN_TOKEN:-}
      # Shared secret authenticating this gateway to auth's internal
      # self-hosted-license endpoints (services/auth/selfhosted_license.go).
      # Generated by install.sh alongside JWT_SECRET/DB_PASSWORD; without a
      # matching value on both containers those endpoints refuse the call
      # rather than trusting an unauthenticated one.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      # Public IP of this host, used by the Caddy on-demand-TLS gate
      # (/api/v1/tls-check) so a domain pointed here auto-provisions HTTPS.
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP:-}
    # Persist instance ID + activated license key/cache so the license survives
    # restarts (otherwise it reverts to trial and churns trial instance IDs).
    volumes:
      - gateway_data:/data
    restart: unless-stopped
    depends_on:
      - auth
      - ingestion
      - query

  auth:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-auth:latest
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      <<: *env-defaults
      AUTH_PORT: "8001"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      KUBEWATCH_LICENSE_KEY: ${KUBEWATCH_LICENSE_KEY:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: "24h"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # External origin used to build SAML SSO SP URLs (ACS / EntityID).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DOMAIN: ${DOMAIN:-}
      NATS_URL: nats://nats:4222
      # Shared secret required on /internal/orgs/{id}/self-hosted-license
      # (see services/auth/selfhosted_license.go and the gateway block above).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      # Cloudflare Turnstile (bot protection on login/signup). Both empty by
      # default -- no widget, no verification, unchanged behavior. Unlike
      # NEXT_PUBLIC_API_URL above, TURNSTILE_SITE_KEY is served to the
      # browser at runtime by GET /auth/setup/status (see
      # frontend/dashboard/components/Turnstile.tsx and shared/turnstile),
      # not baked into the image at build time, so setting both here works
      # without rebuilding anything -- get keys from the Cloudflare
      # dashboard: Turnstile -> add site.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  ingestion:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-ingestion:latest
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      <<: *env-defaults
      INGESTION_PORT: "8002"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
      MIMIR_WRITE_URL: http://mimir-distributor:8080
      LOKI_WRITE_URL: http://loki-distributor:3100
      LOKI_READ_URL: http://loki-query-frontend:3100
      AUTH_SERVICE_URL: http://auth:8001
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  query:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-query:latest
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      <<: *env-defaults
      QUERY_PORT: "8003"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      APP_VERSION: ${APP_VERSION:-dev}
      MIMIR_READ_URL: http://mimir-query-frontend:8080
      MIMIR_WRITE_URL: http://mimir-distributor:8080
      LOKI_WRITE_URL: http://loki-distributor:3100
      LOKI_READ_URL: http://loki-query-frontend:3100
      NATS_URL: nats://nats:4222
      NOTIFICATION_SERVICE_URL: http://notification:8007
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-https://licenses.kubewatchlabs.com}
      NOTIFICATION_CHANNELS_VAULT_MASTER_KEY: ${NOTIFICATION_CHANNELS_VAULT_MASTER_KEY}
      VULNSCAN_VAULT_MASTER_KEY: ${VULNSCAN_VAULT_MASTER_KEY}
      # In-app "Update Now" runs `docker compose pull && up -d` from a detached
      # updater container. COMPOSE_DIR is the host path of this project so the
      # updater can bind-mount it; ${PWD} resolves to where compose was invoked.
      COMPOSE_DIR: ${PWD}
      COMPOSE_FILE: ${COMPOSE_FILE:-docker-compose.yml}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
      # Same BACKUP_* set as the "backup" service below -- query needs these
      # too: it reads them back for the Disaster Recovery page's config
      # display (getBackupConfig) and forwards them into the one-off
      # container "Run backup now" launches (launchManualBackup), which
      # otherwise silently sees none of what's actually configured.
      BACKUP_DESTINATIONS: ${BACKUP_DESTINATIONS:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_USE_SSL: ${BACKUP_S3_USE_SSL:-true}
      BACKUP_SFTP_HOST: ${BACKUP_SFTP_HOST:-}
      BACKUP_SFTP_PORT: ${BACKUP_SFTP_PORT:-22}
      BACKUP_SFTP_USER: ${BACKUP_SFTP_USER:-}
      BACKUP_SFTP_PATH: ${BACKUP_SFTP_PATH:-}
      BACKUP_SFTP_PRIVATE_KEY: ${BACKUP_SFTP_PRIVATE_KEY:-}
      BACKUP_WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
      BACKUP_WEBHOOK_AUTH_HEADER: ${BACKUP_WEBHOOK_AUTH_HEADER:-}
      BACKUP_AZURE_CONTAINER_SAS_URL: ${BACKUP_AZURE_CONTAINER_SAS_URL:-}
    # Docker socket: System Health reads container state; "Update Now" launches
    # the updater container through it.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  alert-engine:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-alert-engine:latest
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      <<: *env-defaults
      ALERT_ENGINE_PORT: "8005"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      MIMIR_READ_URL: http://mimir-query-frontend:8080
      NATS_URL: nats://nats:4222
      EVAL_INTERVAL: "30s"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  scaling-engine:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-scaling-engine:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      SCALING_ENGINE_PORT: "8012"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      MIMIR_READ_URL: http://mimir-query-frontend:8080
      NATS_URL: nats://nats:4222
      SCALE_INTERVAL: "30s"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # AI-Ops Feature 1 (Agent Cost-and-Reliability Ops): background-only
  # evaluation engine, no tenant-facing API of its own — mirrors
  # scaling-engine's split (this engine acts, services/query serves reads/CRUD).
  agent-ops:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-agent-ops:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      AGENT_OPS_PORT: "8014"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      # Its own interval knob, deliberately not the shared EVAL_INTERVAL that
      # alert-engine uses — see services/agent-ops/main.go.
      AGENT_OPS_EVAL_INTERVAL: ${AGENT_OPS_EVAL_INTERVAL:-30s}
      MIMIR_READ_URL: http://mimir-query-frontend:8080
      LOKI_WRITE_URL: http://loki-distributor:3100
      LOKI_READ_URL: http://loki-query-frontend:3100
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # AI-Ops Feature 4 (Docker-vs-Kubernetes Workload Advisor): daily Placement
  # Analysis Job. Reads live-data's existing HTTP API for workload inventory
  # (no persisted workload catalog exists) — see services/workload-advisor/job.go.
  workload-advisor:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-workload-advisor:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      WORKLOAD_ADVISOR_PORT: "8015"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      WORKLOAD_ADVISOR_ANALYSIS_INTERVAL: ${WORKLOAD_ADVISOR_ANALYSIS_INTERVAL:-24h}
      MIMIR_READ_URL: http://mimir-query-frontend:8080
      LIVE_DATA_SERVICE_URL: http://live-data:8009
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Matches the root docker-compose.yml block: on a cold start the first
      # analysis cycle runs immediately, and without this it can hit a
      # not-yet-listening live-data and abort the cycle for every org.
      live-data:
        condition: service_started

  # AI-Ops Feature 5 (Autonomous Remediation): consumes alerts.fire.* and
  # executes/dry-runs playbooks against the same command mechanism scaling-engine
  # uses — see services/remediation-engine.
  remediation-engine:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-remediation-engine:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      REMEDIATION_ENGINE_PORT: "8016"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  notification:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-notification:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      NOTIFICATION_PORT: "8007"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Optional: when set, email is sent via Bird's Email API instead of the
      # SMTP_* settings above (see services/notification/emailsender.go).
      BIRD_API_KEY: ${BIRD_API_KEY:-}
      # Dashboard/upgrade links templated into notification emails (see
      # services/notification/mailer.go's dashboardURL/upgradeURL) --
      # currently only reachable from SaaS/central-only publishers, but set
      # here too so a future self-hosted-only notification never silently
      # links back to KubeWatch's own SaaS dashboard instead of this
      # instance's own domain.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      NOTIFICATION_CHANNELS_VAULT_MASTER_KEY: ${NOTIFICATION_CHANNELS_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  live-data:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-live-data:latest
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      <<: *env-defaults
      PORT: "8009"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
      AUTH_SERVICE_URL: http://auth:8001
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # CLUSTERS_VAULT_MASTER_KEY is required, generate with `openssl rand
  # -base64 32`; without it the service fails to start, encrypting
  # clusters.kubeconfig at rest -- a kubeconfig commonly embeds a client
  # cert+key or a long-lived bearer/service-account token granting full
  # cluster-admin API access. Its own key, never shared with another
  # service.
  clusters:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-clusters:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      PORT: "8008"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      MIMIR_WRITE_URL: http://mimir-distributor:8080
      CLUSTERS_VAULT_MASTER_KEY: ${CLUSTERS_VAULT_MASTER_KEY}
    volumes:
      - ~/.kube:/root/.kube:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  incidents:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-incidents:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      PORT: "8013"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # VCS & CI/CD Observability (kubewatch-vcs-cicd/KUBEWATCH-VCS-CICD-OBSERVABILITY.md):
  # connection CRUD + read APIs for code events/pipeline runs/deployment
  # markers. Never receives Agent pushes directly — those land via
  # live-data's push handler, which writes the same tables this service only
  # ever reads (plus writes vcs_connections from the dashboard UI). Pro/
  # Enterprise gated (plan_limits.vcs_cicd_enabled).
  pipelines:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-pipelines:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      PORT: "8017"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      # Origin Tier-3 CI/CD webhook URLs are built against (see
      # services/pipelines/connections.go's webhookBaseURL) -- without this,
      # a self-hosted install's generated webhook URLs silently point at
      # KubeWatch's own SaaS API gateway instead of this instance.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Tekton detailed-log fetches route through live-data's internal
      # pod-logs endpoint (this service has no cluster network access of
      # its own) -- see services/pipelines/logs.go's fetchTektonLog.
      LIVE_DATA_SERVICE_URL: "http://live-data:8009"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      PIPELINES_VAULT_MASTER_KEY: ${PIPELINES_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Uptime Monitoring: scheduled HTTP(S)/TCP checks against any target the
  # user points it at. No secrets stored (a check is just a target URL/
  # host+port), so unlike pipelines above this has no *_VAULT_MASTER_KEY.
  synthetics:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-synthetics:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      PORT: "8025"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      # Optional -- only needed to import an existing Catchpoint test as a
      # check; plain HTTP/TCP checks store no secret at all.
      SYNTHETICS_VAULT_MASTER_KEY: ${SYNTHETICS_VAULT_MASTER_KEY:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Outbound metrics export: forwards KubeWatch's own collected metrics to
  # a competing/adjacent observability platform's ingest API (Datadog,
  # Dynatrace, etc.). Every target stores a real third-party credential, so
  # EXPORT_TARGETS_VAULT_MASTER_KEY is mandatory, unlike synthetics' above.
  export-targets:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-export-targets:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      PORT: "8026"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      EXPORT_TARGETS_VAULT_MASTER_KEY: ${EXPORT_TARGETS_VAULT_MASTER_KEY}
      MIMIR_WRITE_URL: http://mimir-distributor:8080
      MIMIR_READ_URL: http://mimir-query-frontend:8080
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # VCS & CI/CD Observability Phase 2: verifies each provider's webhook
  # signature and forwards normalized events to live-data. Public-facing
  # (see the gateway's /webhooks/* route) but harmless/unused if no
  # connection ever enables a webhook — Tier 2 polling covers everything by
  # default (kubewatch-vcs-cicd/KUBEWATCH-VCS-CICD-OBSERVABILITY.md §4.1).
  webhook-gateway:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-webhook-gateway:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      PORT: "8018"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      LIVE_DATA_SERVICE_URL: http://live-data:8009
      PIPELINES_VAULT_MASTER_KEY: ${PIPELINES_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Infrastructure Automation control-plane API — Projects/Vaults/Secrets/
  # Variables/Stacks/Runs CRUD, project-scoped RBAC, plan-gating, audit,
  # and run dispatch. IAC_VAULT_MASTER_KEY must be identical on this
  # service and iac-worker (install.sh generates one; rotating it later
  # means every previously-stored secret becomes permanently
  # undecryptable, so treat it like DB_PASSWORD/JWT_SECRET, not a value to
  # change casually).
  iac:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-iac:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      PORT: "8019"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
      LOKI_WRITE_URL: http://loki-distributor:3100
      LOKI_READ_URL: http://loki-query-frontend:3100
      IAC_VAULT_MASTER_KEY: ${IAC_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # Credentials vault — stores login credentials (password/API key/SSH key)
  # encrypted at rest, shared with other users at a per-credential
  # viewer/operator/admin role. No tenant-facing worker like iac has; this
  # service is the whole feature.
  credentials:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-credentials:latest
    environment:
      <<: *env-defaults
      PORT: "8024"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      CREDENTIALS_VAULT_MASTER_KEY: ${CREDENTIALS_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Infrastructure Automation execution engine — runs tofu against
  # a project's Git-synced code. No tenant-facing API; dispatched via NATS
  # (fast path) plus a DB-polling fallback.
  iac-worker:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-iac-worker:latest
    mem_limit: 1g
    mem_reservation: 128m
    environment:
      <<: *env-defaults
      PORT: "8020"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
      LOKI_WRITE_URL: http://loki-distributor:3100
      LOKI_READ_URL: http://loki-query-frontend:3100
      IAC_VAULT_MASTER_KEY: ${IAC_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # CLOUD_VAULT_MASTER_KEY is required, generate with `openssl rand -base64
  # 32`; without it the service fails to start, encrypting cloud_providers.
  # credentials (AWS/GCP/Azure account-level credentials) at rest -- its own
  # key, never shared with devops-agent's/analytics'/iac's.
  cloud:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-cloud:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      PORT: "8010"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      LIVE_DATA_SERVICE_URL: http://live-data:8009
      CLOUD_VAULT_MASTER_KEY: ${CLOUD_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # DataOps: ETL pipeline orchestration (AWS Glue/Step Functions today) and
  # broader multi-cloud resource inventory + lifecycle control (RDS/S3/Lambda
  # today). No plan-tier gate (deliberate product decision); only isAdmin
  # gates its write routes. See services/dataops/service.go.
  dataops:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-dataops:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      PORT: "8021"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      DATAOPS_VAULT_MASTER_KEY: ${DATAOPS_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Analytics: external Postgres/MySQL/Redshift/S3 connections, native
  # in-process data cleaning (expr-lang backed), size-bounded cleaned-
  # dataset storage for dashboarding. Credentials here are vault-encrypted
  # (ANALYTICS_VAULT_MASTER_KEY must be identical wherever this service
  # runs, generate with `openssl rand -base64 32`; without it the service
  # fails to start, matching IAC_VAULT_MASTER_KEY's own fail-closed
  # convention). No plan-tier gate (deliberate, matches dataops) -- only
  # isAdmin gates its write routes. Unrelated to the dataops service above:
  # dataops orchestrates AWS infrastructure, analytics reads and cleans a
  # customer's own data.
  analytics:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-analytics:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      PORT: "8022"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      ANALYTICS_VAULT_MASTER_KEY: ${ANALYTICS_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # AI DevOps Agent: bring-your-own-key LLM log diagnosis, triggered by
  # alerts.fire.* (same NATS consumer as remediation-engine above) or on
  # demand from the dashboard. Never executes anything itself -- a
  # resolvable, allowlisted suggestion becomes a row in
  # remediation_playbooks for remediation-engine to evaluate completely
  # unmodified. No plan-tier gate on diagnosis itself (deliberate, matches
  # analytics/dataops); autonomous execution reuses remediation's existing
  # Enterprise gate. DEVOPS_AGENT_VAULT_MASTER_KEY is required, generate
  # with `openssl rand -base64 32`; without it the service fails to start,
  # matching ANALYTICS_VAULT_MASTER_KEY's own fail-closed convention -- its
  # own key, never shared with analytics' or iac's.
  devops-agent:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-devops-agent:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      PORT: "8023"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
      LOKI_WRITE_URL: http://loki-distributor:3100
      LOKI_READ_URL: http://loki-query-frontend:3100
      MIMIR_READ_URL: http://mimir-query-frontend:8080
      DEVOPS_AGENT_VAULT_MASTER_KEY: ${DEVOPS_AGENT_VAULT_MASTER_KEY}
      DEVOPS_AGENT_MAX_DIAGNOSES_PER_HOUR: ${DEVOPS_AGENT_MAX_DIAGNOSES_PER_HOUR:-20}
      # Log Intelligence spec's "embedded" provider tier: every install gets
      # AI log diagnosis with no BYOK key and no per-token cost, talking to
      # the co-located embedded-llm service below. Set EMBEDDED_LLM_ENABLED=false
      # to turn this off entirely (e.g. a minimal/low-memory install that
      # only ever wants a paid BYOK provider) without removing the container.
      EMBEDDED_LLM_ENABLED: ${EMBEDDED_LLM_ENABLED:-true}
      EMBEDDED_LLM_URL: http://embedded-llm:8080/v1
      EMBEDDED_LLM_MODEL: phi-4-mini-instruct
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # Log Intelligence spec §2's "embedded" Provider Router tier: a small,
  # MIT-licensed model (Phi-4-mini-instruct) served locally via llama.cpp's
  # OpenAI-compatible server, so devops-agent's AI log diagnosis works out
  # of the box with no external API key and no per-token cost -- CPU-only,
  # no GPU required. --hf-repo/--hf-file pull the GGUF from Hugging Face on
  # first start and cache it in embedded_llm_models; every restart after
  # that reuses the cached file rather than re-downloading it.
  #
  # This container image/flag set is llama.cpp's documented server usage as
  # of this writing -- verify against https://github.com/ggml-org/llama.cpp's
  # own docs at deploy time in case the project has renamed the image or
  # changed its CLI flags since.
  #
  # On by default, matching the spec's "no admin configuration required."
  # To opt out entirely (frees the RAM/CPU this container would otherwise
  # use), comment out this whole block AND set EMBEDDED_LLM_ENABLED=false
  # above on devops-agent -- the latter alone stops devops-agent from
  # calling it, but leaves the container itself running idle.
  embedded-llm:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/ggml-org/llama.cpp:server
    # Deliberately NOT the Helm chart's own resources (3Gi request / 4Gi
    # limit, installer/helm/kubewatch-erp/values.yaml's devopsAgent.
    # embeddedLlm.resources) -- those numbers assume a real Kubernetes
    # node with headroom to spare. A single-box self-hosted install has no
    # such guarantee: this exact container was observed (docker stats) at
    # 1.57GiB RSS and 208% CPU during a real diagnosis on a 5.8GB-total
    # host with zero memory limits anywhere, which left the kernel's OOM
    # killer free to kill an unrelated process under pressure instead of
    # scoping the damage to this one container.
    #
    # mem_limit is 3g, not 2g, specifically because 1.57GiB observed during
    # ONE diagnosis leaves too thin a margin above a 2g cap -- a longer log
    # excerpt or a bigger prompt could plausibly cross it and get this
    # container OOM-killed mid-diagnosis, which a customer would see as a
    # failed "Diagnose with AI" call. mem_reservation stays at the
    # steady-state-appropriate 1.5g (the soft target the kernel reclaims
    # toward under pressure, not a hard cap), so this change only widens
    # the ceiling for a genuine spike, it doesn't pre-commit more memory
    # than before. Safe to do now that the host also has swap configured as
    # a backstop (see installer README / ops notes) -- raise mem_limit
    # further if you have a bigger box, or lower it back toward
    # mem_reservation if you'd rather fail a diagnosis than risk the rest
    # of the stack under real memory pressure. The two settings below are
    # compose's classic per-service limits, not the deploy.resources block,
    # so they take effect even without Swarm.
    mem_limit: 3g
    mem_reservation: 1.5g
    cpus: "2"
    environment:
      # Hugging Face has started rejecting the --hf-repo/--hf-file lookup
      # for this repo with a 401 when no token is sent at all, even though
      # the model itself is public -- llama.cpp reads this exact env var
      # name to authenticate its Hub API calls, no CLI flag needed. Leave
      # unset if HF isn't requiring auth for you; a free read-only token
      # from https://huggingface.co/settings/tokens fixes the 401 either
      # way. Empty by default so this container still starts without one
      # (it just fails the same way it did before, not worse).
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - "--hf-repo"
      - "unsloth/Phi-4-mini-instruct-GGUF"
      - "--hf-file"
      - "Phi-4-mini-instruct-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "8192"
    volumes:
      - embedded_llm_models:/root/.cache/llama.cpp
    # Deliberately no `ports:` -- reached only from devops-agent over the
    # compose network, same "no exposed ports beyond what's needed" posture
    # as postgres/nats/the mimir-* components in this file.
    restart: unless-stopped

  integrations:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-integrations:latest
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: *env-defaults
      PORT: "8011"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      INTEGRATIONS_VAULT_MASTER_KEY: ${INTEGRATIONS_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-frontend:latest
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      API_BASE: http://gateway:8000
      NEXT_PUBLIC_MODE: selfhosted
      NEXT_PUBLIC_API_URL: http://${DOMAIN:-localhost}:8000
    restart: unless-stopped
    depends_on:
      - gateway

  # One-shot: copies the self-signed cert install.sh generated into ./certs
  # (host-owned, arbitrary UID) into a named volume with the ownership and
  # permissions Postgres actually requires -- it refuses to start if
  # ssl_key_file is group- or world-readable, and a plain bind mount
  # preserves the host's UID, which essentially never matches the
  # container's postgres user (uid/gid 70 on this alpine-based image, also
  # pgbouncer's in docker-compose.saas.yml, which reads the same volume for
  # its own client-facing TLS). Runs as root -- the default for this plain
  # alpine image -- specifically to be able to chown/chmod at all.
  pg-tls-init:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: public.ecr.aws/docker/library/alpine:3.19
    volumes:
      - ./certs:/host-certs:ro
      - pg_certs:/certs
    command:
      - sh
      - -c
      - |
        cp /host-certs/postgres.crt /host-certs/postgres.key /certs/
        chown 70:70 /certs/postgres.crt /certs/postgres.key
        chmod 644 /certs/postgres.crt
        chmod 600 /certs/postgres.key
    restart: "no"

  postgres:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: public.ecr.aws/docker/library/postgres:16-alpine
    mem_limit: 1g
    mem_reservation: 256m
    environment:
      POSTGRES_DB: kubewatch
      POSTGRES_USER: kubewatch
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Encrypts every service's connection to Postgres (see x-env-defaults'
    # DATABASE_URL sslmode=require above) -- otherwise plaintext on the
    # shared Docker bridge network, readable by any other compromised
    # container on it. installer/docker-compose.saas.yml's postgres
    # override must restate these flags (a command: override replaces the
    # whole list, it doesn't merge with this one).
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/postgres.crt", "-c", "ssl_key_file=/certs/postgres.key"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - pg_certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubewatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      pg-tls-init:
        condition: service_completed_successfully

  # One-shot schema migrator. Applies infra/migrations/*.sql (staged into
  # ./migrations by the deploy job) on every `up`.
  #
  # The migration files are in goose format (-- +goose Up / -- +goose Down).
  # psql does not understand those directives, so we strip everything from
  # "-- +goose Down" onward and apply only the Up section — otherwise psql
  # would run each Down block too and drop the tables it just created.
  # Up sections use CREATE TABLE/COLUMN IF NOT EXISTS and ON CONFLICT, so
  # re-running is safe. Services reading core tables wait for this to finish.
  migrate:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      # Read by psql automatically (same as every Go service's DATABASE_URL
      # sslmode=require above) -- this talks to postgres directly, not
      # through DATABASE_URL, so it needs its own explicit setting.
      PGSSLMODE: require
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - |
        echo "Applying database migrations…"
        # A glob that matches nothing expands to its own literal pattern
        # string in sh (no nullglob here), so an empty/missing /migrations
        # directory would otherwise silently "succeed" with zero migrations
        # ever applied — sed would fail to open a file literally named
        # "/migrations/*.sql", but the `|| true` below swallows that,
        # masking what is actually a critical failure as "Migrations
        # complete.". Fail loudly instead: this always means the updater's
        # migrations refresh didn't run or didn't land where expected.
        set -- /migrations/*.sql
        if [ ! -e "$$1" ]; then
          echo "ERROR: no .sql files found in /migrations — refusing to report success. Check that ./migrations on the host is actually populated (see the updater container's own logs: docker logs kubewatch-updater)." >&2
          exit 1
        fi
        for f in /migrations/*.sql; do
          echo ">> applying $$f (Up only)"
          sed '/-- +goose Down/,$$d' "$$f" | psql -h postgres -U kubewatch -d kubewatch -v ON_ERROR_STOP=0 || true
        done
        echo "Migrations complete."
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Disaster recovery: scheduled Postgres backups pushed to one or more
  # configured destinations (BACKUP_DESTINATIONS, comma-separated: s3, sftp,
  # webhook, azure — an instance can push to just one, or several at once
  # for redundancy), each immediately followed by an automated restore test
  # (restores into a scratch database on this same Postgres server, never
  # the real "kubewatch" database, verifies a basic row count, then drops
  # it). Self-hosted only for now; SaaS's own platform-wide backups are an
  # operator-console concern, not something exposed per-org. If
  # BACKUP_DESTINATIONS isn't set, this just idles — no backups run, and
  # nothing else in the stack is affected.
  #
  # The manual "run backup now" trigger in services/query's Docker-Engine-API
  # code launches a one-off container running the same logic as below with
  # triggered_by=manual; keep the two in sync if this changes.
  backup:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: kubewatch
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: kubewatch
      # Same reasoning as the migrate service's PGSSLMODE above -- pg_dump/
      # psql/pg_restore all read this directly, bypassing DATABASE_URL.
      PGSSLMODE: require
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # 0 (or unset) means "keep forever" -- backups are never pruned. A
      # positive value is the number of days a backup and its destination
      # copies (S3 object, SFTP file, Azure blob -- webhook has no generic
      # delete API and is left alone) are kept before the next scheduled
      # backup prunes it.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Comma-separated subset of: s3, sftp, webhook, azure. Empty disables
      # the feature entirely. Each kind's own env vars below only matter if
      # that kind is listed here.
      BACKUP_DESTINATIONS: ${BACKUP_DESTINATIONS:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_USE_SSL: ${BACKUP_S3_USE_SSL:-true}
      # SFTP: a dedicated, backup-only-scoped SSH key is strongly recommended
      # over reusing a general admin key. Host key verification is
      # trust-on-first-connect (accept-new), not pre-pinned — acceptable for
      # a destination you configured yourself, not a substitute for network
      # controls if that matters for your threat model.
      BACKUP_SFTP_HOST: ${BACKUP_SFTP_HOST:-}
      BACKUP_SFTP_PORT: ${BACKUP_SFTP_PORT:-22}
      BACKUP_SFTP_USER: ${BACKUP_SFTP_USER:-}
      BACKUP_SFTP_PATH: ${BACKUP_SFTP_PATH:-}
      BACKUP_SFTP_PRIVATE_KEY: ${BACKUP_SFTP_PRIVATE_KEY:-} # base64-encoded PEM private key
      # Generic webhook: the dump is POSTed as the raw request body.
      BACKUP_WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
      BACKUP_WEBHOOK_AUTH_HEADER: ${BACKUP_WEBHOOK_AUTH_HEADER:-} # e.g. "Bearer <token>", sent as Authorization
      # Azure Blob: a container-level SAS URL with write permission
      # (generate via the Azure Portal or `az storage container generate-sas`),
      # e.g. https://acct.blob.core.windows.net/container?sv=...&sig=... —
      # avoids implementing Azure's Shared-Key HMAC signing from scratch.
      BACKUP_AZURE_CONTAINER_SAS_URL: ${BACKUP_AZURE_CONTAINER_SAS_URL:-}
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$BACKUP_DESTINATIONS" ]; then
          echo "BACKUP_DESTINATIONS not set -- disaster recovery backups are disabled. Set this (and the matching destination env vars) to enable scheduled backups and restore tests."
          while true; do sleep 3600; done
        fi

        has_destination() {
          case ",$$BACKUP_DESTINATIONS," in
            *",$$1,"*) return 0 ;;
            *) return 1 ;;
          esac
        }

        if has_destination s3; then
          echo "==> installing mc (MinIO client, for the s3 destination)"
          wget -qO /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /usr/local/bin/mc
          SCHEME=https
          if [ "$$BACKUP_S3_USE_SSL" = "false" ]; then SCHEME=http; fi
          mc alias set dr "$$SCHEME://$$BACKUP_S3_ENDPOINT" "$$BACKUP_S3_ACCESS_KEY" "$$BACKUP_S3_SECRET_KEY" --api S3v4
        fi
        if has_destination sftp; then
          echo "==> installing openssh-client (for the sftp destination)"
          apk add --no-cache openssh-client >/dev/null
        fi

        record_destination() {
          # $$1=row id  $$2=backup id  $$3=kind  $$4=status  $$5=location  $$6=error
          psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
            "INSERT INTO dr_backup_destinations (id, backup_id, kind, status, location, error, completed_at) VALUES ('$$1', '$$2', '$$3', '$$4', '$$5', '$$6', NOW())" >/dev/null
        }

        push_s3() { mc cp "$$1" "dr/$$BACKUP_S3_BUCKET/$$2" >/dev/null 2>&1; }

        push_sftp() {
          key_file="/tmp/sftp_key_$$$$"
          echo "$$BACKUP_SFTP_PRIVATE_KEY" | base64 -d > "$$key_file" 2>/dev/null
          chmod 600 "$$key_file"
          # A single "put" piped in via stdin, rather than a heredoc — avoids
          # any risk of the heredoc terminator not matching once this script
          # is indented inside a YAML block scalar.
          echo "put $$1 $$BACKUP_SFTP_PATH/$$2" | sftp -i "$$key_file" -P "$$BACKUP_SFTP_PORT" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$$BACKUP_SFTP_USER@$$BACKUP_SFTP_HOST" >/dev/null 2>&1
          rc=$$?
          rm -f "$$key_file"
          return $$rc
        }

        push_webhook() {
          # Branches instead of building an optional flag into a variable and
          # leaving it unquoted — an unquoted "--header=...: value" variable
          # would word-split on its embedded space/colon and mangle the flag.
          if [ -n "$$BACKUP_WEBHOOK_AUTH_HEADER" ]; then
            wget -q --method=POST --body-file="$$1" \
              --header="Authorization: $$BACKUP_WEBHOOK_AUTH_HEADER" \
              --header="Content-Type: application/octet-stream" --header="X-Backup-Filename: $$2" \
              -O /dev/null "$$BACKUP_WEBHOOK_URL" >/dev/null 2>&1
          else
            wget -q --method=POST --body-file="$$1" \
              --header="Content-Type: application/octet-stream" --header="X-Backup-Filename: $$2" \
              -O /dev/null "$$BACKUP_WEBHOOK_URL" >/dev/null 2>&1
          fi
        }

        push_azure() {
          base="$${BACKUP_AZURE_CONTAINER_SAS_URL%%\?*}"
          query="$${BACKUP_AZURE_CONTAINER_SAS_URL#*\?}"
          wget -q --method=PUT --body-file="$$1" \
            --header="x-ms-blob-type: BlockBlob" --header="Content-Type: application/octet-stream" \
            -O /dev/null "$$base/$$2?$$query" >/dev/null 2>&1
        }

        delete_s3() { mc rm "dr/$$BACKUP_S3_BUCKET/$$1" >/dev/null 2>&1; }

        delete_sftp() {
          key_file="/tmp/sftp_key_$$$$"
          echo "$$BACKUP_SFTP_PRIVATE_KEY" | base64 -d > "$$key_file" 2>/dev/null
          chmod 600 "$$key_file"
          echo "rm $$1" | sftp -i "$$key_file" -P "$$BACKUP_SFTP_PORT" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$$BACKUP_SFTP_USER@$$BACKUP_SFTP_HOST" >/dev/null 2>&1
          rc=$$?
          rm -f "$$key_file"
          return $$rc
        }

        delete_azure() {
          base="$${BACKUP_AZURE_CONTAINER_SAS_URL%%\?*}"
          query="$${BACKUP_AZURE_CONTAINER_SAS_URL#*\?}"
          wget -q --method=DELETE -O /dev/null "$$base/$$1?$$query" >/dev/null 2>&1
        }

        # Prunes backups (and their destination copies) older than
        # BACKUP_RETENTION_DAYS -- empty or non-positive means "keep
        # forever," never prune. Best-effort per destination: a delete
        # call's exit status is deliberately ignored rather than blocking
        # the dr_backups row's own deletion below -- a stale row pointing
        # at an already-gone-or-undeletable file is worse than a file
        # outliving its DB record by one cycle. webhook has no generic
        # delete API, so it's skipped entirely -- nothing to call.
        #
        # delete_s3/delete_sftp/delete_azure target wherever
        # BACKUP_S3_BUCKET/BACKUP_SFTP_HOST/BACKUP_AZURE_CONTAINER_SAS_URL
        # point RIGHT NOW, not a snapshot of what was configured when that
        # specific backup was originally pushed -- if a destination is
        # reconfigured between backups, older backups at the old location
        # become permanently un-prunable (silently orphaned) rather than
        # erroring. Accepted: this mirrors the push side's own existing
        # behavior, not something retention introduces.
        prune_old_backups() {
          retention="$${BACKUP_RETENTION_DAYS:-0}"
          case "$$retention" in
            ''|*[!0-9]*) return 0 ;;
          esac
          [ "$$retention" -le 0 ] && return 0

          old_ids=$$(psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -t -A -c \
            "SELECT id FROM dr_backups WHERE started_at < NOW() - INTERVAL '$$retention days'" 2>/dev/null)
          [ -z "$$old_ids" ] && return 0

          for prune_id in $$old_ids; do
            psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -t -A -F'|' -c \
              "SELECT kind, location FROM dr_backup_destinations WHERE backup_id='$$prune_id' AND status='success' AND location IS NOT NULL" 2>/dev/null |
            while IFS='|' read -r prune_kind prune_location; do
              [ -z "$$prune_location" ] && continue
              case "$$prune_kind" in
                s3) delete_s3 "$$prune_location" ;;
                sftp) delete_sftp "$$prune_location" ;;
                azure) delete_azure "$$prune_location" ;;
                *) : ;;
              esac
            done
            psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c "DELETE FROM dr_backups WHERE id='$$prune_id'" >/dev/null 2>&1
          done
        }

        # Pushes to every configured destination, recording one
        # dr_backup_destinations row per attempt. Returns success (0) if at
        # least one destination succeeded.
        push_all_destinations() {
          backup_id="$$1"
          dump_file="$$2"
          any_ok=1
          saved_ifs="$$IFS"
          IFS=','
          set -- $$BACKUP_DESTINATIONS
          IFS="$$saved_ifs"
          for dest in "$$@"; do
            dest=$$(echo "$$dest" | tr -d ' ')
            [ -z "$$dest" ] && continue
            row_id="drd_$$(date +%s)_$$$$_$$dest"
            name="$${backup_id}.dump"
            case "$$dest" in
              s3)
                key="backups/$$name"
                if push_s3 "$$dump_file" "$$key"; then
                  record_destination "$$row_id" "$$backup_id" "s3" "success" "$$key" ""; any_ok=0
                else
                  record_destination "$$row_id" "$$backup_id" "s3" "failed" "" "upload failed"
                fi ;;
              sftp)
                if push_sftp "$$dump_file" "$$name"; then
                  record_destination "$$row_id" "$$backup_id" "sftp" "success" "$$BACKUP_SFTP_PATH/$$name" ""; any_ok=0
                else
                  record_destination "$$row_id" "$$backup_id" "sftp" "failed" "" "sftp upload failed"
                fi ;;
              webhook)
                if push_webhook "$$dump_file" "$$name"; then
                  record_destination "$$row_id" "$$backup_id" "webhook" "success" "$$BACKUP_WEBHOOK_URL" ""; any_ok=0
                else
                  record_destination "$$row_id" "$$backup_id" "webhook" "failed" "" "webhook post failed"
                fi ;;
              azure)
                if push_azure "$$dump_file" "$$name"; then
                  record_destination "$$row_id" "$$backup_id" "azure" "success" "$$name" ""; any_ok=0
                else
                  record_destination "$$row_id" "$$backup_id" "azure" "failed" "" "azure upload failed"
                fi ;;
              *)
                echo "unknown BACKUP_DESTINATIONS entry: $$dest" >&2 ;;
            esac
          done
          return $$any_ok
        }

        run_restore_test() {
          backup_id="$$1"
          dump_file="$$2"
          test_id="rt_$$(date +%s)_$$$$"
          scratch_db="dr_test_$$(date +%s)"
          psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO dr_restore_tests (id, backup_id, status) VALUES ('$$test_id', '$$backup_id', 'running')"

          if psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $$scratch_db" \
             && pg_restore -h "$$PGHOST" -U "$$PGUSER" -d "$$scratch_db" --format=custom "$$dump_file"; then
            org_count=$$(psql -h "$$PGHOST" -U "$$PGUSER" -d "$$scratch_db" -t -A -c "SELECT COUNT(*) FROM organizations" 2>/dev/null)
            if [ -n "$$org_count" ]; then
              psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
                "UPDATE dr_restore_tests SET status='passed', completed_at=NOW(), verified_org_count=$$org_count WHERE id='$$test_id'"
            else
              psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
                "UPDATE dr_restore_tests SET status='failed', completed_at=NOW(), error='verification query failed' WHERE id='$$test_id'"
            fi
          else
            psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
              "UPDATE dr_restore_tests SET status='failed', completed_at=NOW(), error='restore failed' WHERE id='$$test_id'"
          fi
          # Always drop the scratch database, even if restore/verify failed partway.
          psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c "DROP DATABASE IF EXISTS $$scratch_db" >/dev/null 2>&1 || true
        }

        run_backup() {
          triggered_by="$${1:-scheduled}"
          id="bkp_$$(date +%s)_$$$$"
          psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO dr_backups (id, status, triggered_by) VALUES ('$$id', 'running', '$$triggered_by')"

          dump_file="/tmp/$${id}.dump"
          if pg_dump -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" --format=custom --compress=9 -f "$$dump_file"; then
            size=$$(stat -c %s "$$dump_file")
            if push_all_destinations "$$id" "$$dump_file"; then
              psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
                "UPDATE dr_backups SET status='success', completed_at=NOW(), size_bytes=$$size WHERE id='$$id'"
              run_restore_test "$$id" "$$dump_file"
            else
              psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
                "UPDATE dr_backups SET status='failed', completed_at=NOW(), size_bytes=$$size, error='all configured destinations failed' WHERE id='$$id'"
            fi
          else
            psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
              "UPDATE dr_backups SET status='failed', completed_at=NOW(), error='pg_dump failed' WHERE id='$$id'"
          fi
          prune_old_backups
          rm -f "$$dump_file"
        }

        echo "==> disaster-recovery backup loop starting (interval=$${BACKUP_INTERVAL_SECONDS}s, destinations=$$BACKUP_DESTINATIONS)"
        while true; do
          run_backup scheduled
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Metrics store: Grafana Mimir in full microservices deployment mode
  # (distributor/ingester/querier/query-frontend/query-scheduler/compactor/
  # store-gateway below), replacing the old single-container
  # victoriametrics: block above. Per-tenant isolation is Mimir's own
  # X-Scope-OrgID header enforcement (shared/tsdb/client.go), not a label
  # convention. Single replica per component (not HA) -- see mimir.yaml's
  # own header comment for what real HA would additionally need.
  #
  # S3-compatible object storage backing every component's blocks
  # (mimir.yaml's common.storage.s3, bucket_name: mimir-blocks).
  # docker-compose.saas.yml's mimir-* overlay points at real AWS S3 instead
  # and never runs minio/minio-init at all -- see mimir.yaml's own header
  # comment.
  #
  # Gated behind the "selfhost-storage" Compose profile, defined here but
  # inactive by default -- see x-mimir-common's own comment above for why
  # that doesn't break this file's `config` validation even so. Activate it
  # for a real self-hosted install with EITHER:
  #   docker compose --profile selfhost-storage -f docker-compose.selfhost.yml up -d
  # OR by setting, once, in this directory's own .env:
  #   COMPOSE_PROFILES=selfhost-storage
  # Skip both and every mimir-* component below still starts, but every
  # metrics write/read fails: the bucket is never created because minio
  # itself never runs.
  minio:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: minio/minio:latest
    mem_limit: 1g
    mem_reservation: 256m
    profiles: ["selfhost-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: creates the mimir-blocks bucket, then exits. Every mimir-*
  # component depends on this completing successfully (x-mimir-common
  # above) before it starts writing/reading. Same "selfhost-storage" profile
  # as minio above -- see that service's comment for how it's activated.
  minio-init:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: minio/mc:latest
    profiles: ["selfhost-storage"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/mimir-blocks &&
      mc mb --ignore-existing local/loki-chunks
      "
    restart: "no"

  # Stateless -- accepts remote_write pushes (MIMIR_WRITE_URL below points
  # every service at this one). No local storage of its own.
  mimir-distributor:
    <<: *mimir-common
    mem_limit: 512m
    mem_reservation: 256m
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true", "-target=distributor"]
    # exposed to other containers on the compose network at :8080 -- this is
    # MIMIR_WRITE_URL for every other service below, never published to the
    # host (see this file's "no exposed ports beyond what's needed"
    # convention, same as postgres/nats/the rest of these mimir-* services).

  # Holds recently-ingested samples in memory + WAL before shipping blocks to
  # object storage -- the most memory-hungry component (sizing mirrors
  # installer/helm/kubewatch-erp/values.yaml's mimir.ingester.resources for
  # the same reason every component below mirrors its Helm counterpart: this
  # is the same architecture, just Compose instead of Kubernetes).
  mimir-ingester:
    <<: *mimir-common
    mem_limit: 3g
    mem_reservation: 1g
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true", "-target=ingester"]
    volumes:
      - ./mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir_ingester_data:/data

  # Stateless -- serves queries, connects to mimir-query-frontend only
  # through mimir-query-scheduler (see mimir.yaml's own comment on why).
  mimir-querier:
    <<: *mimir-common
    mem_limit: 512m
    mem_reservation: 256m
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true", "-target=querier", "-querier.scheduler-address=mimir-query-scheduler:9095"]

  # Stateless -- the query entrypoint (MIMIR_READ_URL below points every
  # service at this one), merges/caches results but does no heavy lifting
  # itself; connects to mimir-querier only through mimir-query-scheduler.
  mimir-query-frontend:
    <<: *mimir-common
    mem_limit: 256m
    mem_reservation: 128m
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true", "-target=query-frontend", "-query-frontend.scheduler-address=mimir-query-scheduler:9095"]
    # exposed to other containers on the compose network at :8080 -- this is
    # MIMIR_READ_URL for every other service below.

  # Thin queueing layer between mimir-query-frontend and mimir-querier --
  # required by this Mimir version (no direct frontend<->querier mode), but
  # does no heavy lifting itself.
  mimir-query-scheduler:
    <<: *mimir-common
    mem_limit: 128m
    mem_reservation: 64m
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true", "-target=query-scheduler"]

  # CPU-heavy block-merge work; its own volume is working-directory scratch
  # space, not a long-term store.
  mimir-compactor:
    <<: *mimir-common
    mem_limit: 1g
    mem_reservation: 512m
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true", "-target=compactor"]
    volumes:
      - ./mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir_compactor_data:/data

  # Loads block index-headers into memory to serve historical queries --
  # its own volume backs that cache.
  mimir-store-gateway:
    <<: *mimir-common
    mem_limit: 2g
    mem_reservation: 1g
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true", "-target=store-gateway"]
    volumes:
      - ./mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir_store_gateway_data:/data

  # Log-oriented sibling of the mimir-* services above: holds AI agent spans
  # and continuously-collected container/pod logs (see services/ingestion's
  # startBulkLogsWriter and startTSDBWriter). Replaces the single-container
  # victorialogs: block above with full microservices-mode Loki, same
  # migration mimir-* above went through for metrics -- ingestion/query
  # (and every other consumer) now point at LOKI_WRITE_URL/LOKI_READ_URL
  # instead. Per-tenant isolation is Loki's own X-Scope-OrgID header
  # enforcement (shared/tsdb/logs_client.go), not a label convention. See
  # loki.yaml's own header comment for what real HA would additionally
  # need. No loki-ruler, same reasoning as no mimir-ruler.
  #
  # S3-compatible object storage backing every component's chunks (loki.
  # yaml's common.storage.s3, bucketnames: loki-chunks) -- same bundled
  # MinIO the mimir-* components above use, same "selfhost-storage" profile
  # gate, same docker-compose.saas.yml override to real AWS S3 instead. See
  # x-mimir-common's own comment above for how that profile gets activated
  # and why `depends_on`'s `required: false` matters even when it isn't.
  #
  # Stateless -- accepts push writes (LOKI_WRITE_URL below points every
  # service at this one). No local storage of its own.
  loki-distributor:
    <<: *loki-common
    mem_limit: 512m
    mem_reservation: 256m
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true", "-target=distributor"]
    # exposed to other containers on the compose network at :3100 -- this is
    # LOKI_WRITE_URL for every other service below, never published to the
    # host (same "no exposed ports beyond what's needed" convention as the
    # mimir-* services above).

  # Holds recently-ingested log chunks in memory + WAL before shipping to
  # object storage -- sizing mirrors installer/helm/kubewatch-erp/values.
  # yaml's loki.ingester.resources for the same reason every component
  # below mirrors its Helm counterpart.
  loki-ingester:
    <<: *loki-common
    mem_limit: 2g
    mem_reservation: 512m
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true", "-target=ingester"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki_ingester_data:/loki

  # Stateless -- serves queries, connects to loki-query-frontend only
  # through loki-query-scheduler (see loki.yaml's own comment on why).
  loki-querier:
    <<: *loki-common
    mem_limit: 512m
    mem_reservation: 256m
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true", "-target=querier", "-querier.scheduler-address=loki-query-scheduler:9095"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
        required: false
      loki-query-scheduler:
        condition: service_healthy
      loki-ingester:
        condition: service_healthy
      loki-index-gateway:
        condition: service_healthy

  # Stateless -- the query entrypoint (LOKI_READ_URL below points every
  # service at this one), merges/caches results but does no heavy lifting
  # itself; connects to loki-querier only through loki-query-scheduler.
  loki-query-frontend:
    <<: *loki-common
    mem_limit: 256m
    mem_reservation: 128m
    # NOT -query-frontend.scheduler-address -- different flag prefix than
    # Mimir's equivalent; confirmed against this exact image's own -help
    # output.
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true", "-target=query-frontend", "-frontend.scheduler-address=loki-query-scheduler:9095"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
        required: false
      loki-query-scheduler:
        condition: service_healthy
      loki-ingester:
        condition: service_healthy
      loki-index-gateway:
        condition: service_healthy
    # exposed to other containers on the compose network at :3100 -- this is
    # LOKI_READ_URL for every other service below.

  # Thin queueing layer between loki-query-frontend and loki-querier --
  # required by this Loki version (no direct frontend<->querier mode), but
  # does no heavy lifting itself. Needs a healthcheck (unlike Mimir's
  # equivalent): loki-querier/loki-query-frontend each open a persistent
  # gRPC stream to this on startup, and that stream never retries if it
  # fails once -- without gating both behind this being reachable first,
  # every query hangs forever on a fresh `docker compose up` instead of
  # erroring. Confirmed by actually cold-starting the stack repeatedly.
  loki-query-scheduler:
    <<: *loki-common
    mem_limit: 128m
    mem_reservation: 64m
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true", "-target=query-scheduler"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 3s
      timeout: 3s
      retries: 10

  # CPU-heavy chunk/index compaction work; its own volume is working-
  # directory scratch space, not a long-term store.
  loki-compactor:
    <<: *loki-common
    mem_limit: 1g
    mem_reservation: 512m
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true", "-target=compactor"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki_compactor_data:/loki

  # Serves index lookups for the querier (loki.yaml's index_gateway.mode:
  # ring) -- its own volume backs the local index cache.
  loki-index-gateway:
    <<: *loki-common
    mem_limit: 1g
    mem_reservation: 512m
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true", "-target=index-gateway"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki_index_gateway_data:/loki

  nats:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: public.ecr.aws/docker/library/nats:2-alpine
    mem_limit: 256m
    mem_reservation: 64m
    # -m enables the HTTP monitoring port used by the healthcheck below —
    # without a healthcheck, `depends_on: condition: service_started` only
    # waits for the process to start, not for NATS to actually accept
    # connections. On a fresh `up -d`, dependents can start (and give up
    # connecting) before NATS is ready, silently breaking the metrics
    # pipeline until manually restarted — see live-data's NATS connection
    # comment for how it degrades instead of crashing.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - nats_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  pg_certs:
  nats_data:
  caddy_data:
  gateway_data:
  embedded_llm_models:
  minio_data:
  mimir_ingester_data:
  mimir_compactor_data:
  mimir_store_gateway_data:
  loki_ingester_data:
  loki_compactor_data:
  loki_index_gateway_data:
