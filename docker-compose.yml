# Caps every container's own stdout/stderr log file so it can never fill
# the disk on its own -- Docker's json-file driver has no size limit by
# default, and a noisy or crashlooping container can otherwise grow
# unbounded indefinitely. 10MB x 3 files per container is generous for
# debugging while keeping a worst case (every one of ~30 services at the
# cap simultaneously) well under a gigabyte total.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Single source of truth for DATABASE_URL, merged into each service's own
# environment block below via YAML's `<<:` merge key -- avoids repeating
# this exact connection-string template ~20 times. DB_PASSWORD itself
# stays the one secret an operator actually sets (README's install
# script generates it), this just assembles the DSN from it in one place.
x-env-defaults: &env-defaults
  DATABASE_URL: postgres://kubewatch:${DB_PASSWORD}@postgres:5432/kubewatch?sslmode=disable

services:
  caddy:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: public.ecr.aws/docker/library/caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - gateway

  gateway:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-gateway:latest
    environment:
      GATEWAY_PORT: "8000"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      AUTH_SERVICE_URL: http://auth:8001
      INGESTION_SERVICE_URL: http://ingestion:8002
      QUERY_SERVICE_URL: http://query:8003
      LIVE_DATA_SERVICE_URL: http://live-data:8009
      CLUSTERS_SERVICE_URL: http://clusters:8008
      INCIDENTS_SERVICE_URL: http://incidents:8013
      PIPELINES_SERVICE_URL: http://pipelines:8017
      WEBHOOK_GATEWAY_SERVICE_URL: http://webhook-gateway:8018
      IAC_SERVICE_URL: http://iac:8019
      CREDENTIALS_SERVICE_URL: http://credentials:8024
      # Only route proxied here is the public marketing-email unsubscribe link
      # (/api/v1/email/unsubscribe); everything else notification does is
      # NATS-driven or internal-only.
      NOTIFICATION_SERVICE_URL: http://notification:8007
      CLOUD_SERVICE_URL: http://cloud:8010
      DATAOPS_SERVICE_URL: http://dataops:8021
      ANALYTICS_SERVICE_URL: http://analytics:8022
      DEVOPS_AGENT_SERVICE_URL: http://devops-agent:8023
      INTEGRATIONS_SERVICE_URL: http://integrations:8011
      JWT_SECRET: ${JWT_SECRET}
      KUBEWATCH_LICENSE_KEY: ${KUBEWATCH_LICENSE_KEY:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      # License server the gateway asks to mint keys for POST
      # /api/v1/admin/license/generate-dev. Fed from LICENSE_SERVER_URL — the one
      # name every other service in this repo already uses for the same target
      # (query, billing, and the Helm ConfigMap) — so the two stacks that share
      # this file each get the right thing without a second variable to keep in
      # sync: a SaaS host (this file + docker-compose.saas.yml) has
      # LICENSE_SERVER_URL=http://license:8012 in its .env and reaches the
      # co-located license container, while a plain self-hosted install has no
      # license container at all and correctly falls back to the public server.
      # Previously unset, so the gateway silently used its in-code default
      # regardless of deployment.
      LICENSE_SERVICE_URL: ${LICENSE_SERVER_URL:-https://licenses.kubewatchlabs.com}
      # Admin token for the above. Passed through, never generated by
      # install.sh (unlike JWT_SECRET/DB_PASSWORD/IAC_VAULT_MASTER_KEY, which the
      # install owns both ends of): this authenticates against whichever license
      # server LICENSE_SERVICE_URL points at, so only that server's operator can
      # supply a valid value. Left empty on a normal self-hosted install, where
      # generate-dev then refuses with an explicit "not configured" rather than
      # issuing a request that could never be authorized.
      LICENSE_ADMIN_TOKEN: ${LICENSE_ADMIN_TOKEN:-}
      # Shared secret authenticating this gateway to auth's internal
      # self-hosted-license endpoints (services/auth/selfhosted_license.go).
      # Generated by install.sh alongside JWT_SECRET/DB_PASSWORD; without a
      # matching value on both containers those endpoints refuse the call
      # rather than trusting an unauthenticated one.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      # Public IP of this host, used by the Caddy on-demand-TLS gate
      # (/api/v1/tls-check) so a domain pointed here auto-provisions HTTPS.
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP:-}
    # Persist instance ID + activated license key/cache so the license survives
    # restarts (otherwise it reverts to trial and churns trial instance IDs).
    volumes:
      - gateway_data:/data
    restart: unless-stopped
    depends_on:
      - auth
      - ingestion
      - query

  auth:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-auth:latest
    environment:
      <<: *env-defaults
      AUTH_PORT: "8001"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      KUBEWATCH_LICENSE_KEY: ${KUBEWATCH_LICENSE_KEY:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: "24h"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # External origin used to build SAML SSO SP URLs (ACS / EntityID).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DOMAIN: ${DOMAIN:-}
      NATS_URL: nats://nats:4222
      # Shared secret required on /internal/orgs/{id}/self-hosted-license
      # (see services/auth/selfhosted_license.go and the gateway block above).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  ingestion:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-ingestion:latest
    environment:
      <<: *env-defaults
      INGESTION_PORT: "8002"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
      VICTORIAMETRICS_INSERT_URL: http://victoriametrics:8428
      VICTORIALOGS_URL: http://victorialogs:9428
      AUTH_SERVICE_URL: http://auth:8001
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  query:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-query:latest
    environment:
      <<: *env-defaults
      QUERY_PORT: "8003"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      APP_VERSION: ${APP_VERSION:-dev}
      VICTORIAMETRICS_SELECT_URL: http://victoriametrics:8428
      VICTORIAMETRICS_INSERT_URL: http://victoriametrics:8428
      VICTORIALOGS_URL: http://victorialogs:9428
      NATS_URL: nats://nats:4222
      NOTIFICATION_SERVICE_URL: http://notification:8007
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-https://licenses.kubewatchlabs.com}
      # In-app "Update Now" runs `docker compose pull && up -d` from a detached
      # updater container. COMPOSE_DIR is the host path of this project so the
      # updater can bind-mount it; ${PWD} resolves to where compose was invoked.
      COMPOSE_DIR: ${PWD}
      COMPOSE_FILE: ${COMPOSE_FILE:-docker-compose.yml}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
      # Same BACKUP_* set as the "backup" service below -- query needs these
      # too: it reads them back for the Disaster Recovery page's config
      # display (getBackupConfig) and forwards them into the one-off
      # container "Run backup now" launches (launchManualBackup), which
      # otherwise silently sees none of what's actually configured.
      BACKUP_DESTINATIONS: ${BACKUP_DESTINATIONS:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_USE_SSL: ${BACKUP_S3_USE_SSL:-true}
      BACKUP_SFTP_HOST: ${BACKUP_SFTP_HOST:-}
      BACKUP_SFTP_PORT: ${BACKUP_SFTP_PORT:-22}
      BACKUP_SFTP_USER: ${BACKUP_SFTP_USER:-}
      BACKUP_SFTP_PATH: ${BACKUP_SFTP_PATH:-}
      BACKUP_SFTP_PRIVATE_KEY: ${BACKUP_SFTP_PRIVATE_KEY:-}
      BACKUP_WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
      BACKUP_WEBHOOK_AUTH_HEADER: ${BACKUP_WEBHOOK_AUTH_HEADER:-}
      BACKUP_AZURE_CONTAINER_SAS_URL: ${BACKUP_AZURE_CONTAINER_SAS_URL:-}
    # Docker socket: System Health reads container state; "Update Now" launches
    # the updater container through it.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  alert-engine:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-alert-engine:latest
    environment:
      <<: *env-defaults
      ALERT_ENGINE_PORT: "8005"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      VICTORIAMETRICS_SELECT_URL: http://victoriametrics:8428
      NATS_URL: nats://nats:4222
      EVAL_INTERVAL: "30s"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  scaling-engine:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-scaling-engine:latest
    environment:
      <<: *env-defaults
      SCALING_ENGINE_PORT: "8012"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      VICTORIAMETRICS_SELECT_URL: http://victoriametrics:8428
      NATS_URL: nats://nats:4222
      SCALE_INTERVAL: "30s"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # AI-Ops Feature 1 (Agent Cost-and-Reliability Ops): background-only
  # evaluation engine, no tenant-facing API of its own — mirrors
  # scaling-engine's split (this engine acts, services/query serves reads/CRUD).
  agent-ops:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-agent-ops:latest
    environment:
      <<: *env-defaults
      AGENT_OPS_PORT: "8014"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      # Its own interval knob, deliberately not the shared EVAL_INTERVAL that
      # alert-engine uses — see services/agent-ops/main.go.
      AGENT_OPS_EVAL_INTERVAL: ${AGENT_OPS_EVAL_INTERVAL:-30s}
      VICTORIAMETRICS_SELECT_URL: http://victoriametrics:8428
      VICTORIALOGS_URL: http://victorialogs:9428
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # AI-Ops Feature 4 (Docker-vs-Kubernetes Workload Advisor): daily Placement
  # Analysis Job. Reads live-data's existing HTTP API for workload inventory
  # (no persisted workload catalog exists) — see services/workload-advisor/job.go.
  workload-advisor:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-workload-advisor:latest
    environment:
      <<: *env-defaults
      WORKLOAD_ADVISOR_PORT: "8015"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      WORKLOAD_ADVISOR_ANALYSIS_INTERVAL: ${WORKLOAD_ADVISOR_ANALYSIS_INTERVAL:-24h}
      VICTORIAMETRICS_SELECT_URL: http://victoriametrics:8428
      LIVE_DATA_SERVICE_URL: http://live-data:8009
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Matches the root docker-compose.yml block: on a cold start the first
      # analysis cycle runs immediately, and without this it can hit a
      # not-yet-listening live-data and abort the cycle for every org.
      live-data:
        condition: service_started

  # AI-Ops Feature 5 (Autonomous Remediation): consumes alerts.fire.* and
  # executes/dry-runs playbooks against the same command mechanism scaling-engine
  # uses — see services/remediation-engine.
  remediation-engine:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-remediation-engine:latest
    environment:
      <<: *env-defaults
      REMEDIATION_ENGINE_PORT: "8016"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  notification:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-notification:latest
    environment:
      <<: *env-defaults
      NOTIFICATION_PORT: "8007"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Optional: when set, email is sent via Bird's Email API instead of the
      # SMTP_* settings above (see services/notification/emailsender.go).
      BIRD_API_KEY: ${BIRD_API_KEY:-}
      # Dashboard/upgrade links templated into notification emails (see
      # services/notification/mailer.go's dashboardURL/upgradeURL) --
      # currently only reachable from SaaS/central-only publishers, but set
      # here too so a future self-hosted-only notification never silently
      # links back to KubeWatch's own SaaS dashboard instead of this
      # instance's own domain.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  live-data:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-live-data:latest
    environment:
      <<: *env-defaults
      PORT: "8009"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
      AUTH_SERVICE_URL: http://auth:8001
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  clusters:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-clusters:latest
    environment:
      <<: *env-defaults
      PORT: "8008"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      VICTORIAMETRICS_INSERT_URL: http://victoriametrics:8428
    volumes:
      - ~/.kube:/root/.kube:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  incidents:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-incidents:latest
    environment:
      <<: *env-defaults
      PORT: "8013"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # VCS & CI/CD Observability (kubewatch-vcs-cicd/KUBEWATCH-VCS-CICD-OBSERVABILITY.md):
  # connection CRUD + read APIs for code events/pipeline runs/deployment
  # markers. Never receives Agent pushes directly — those land via
  # live-data's push handler, which writes the same tables this service only
  # ever reads (plus writes vcs_connections from the dashboard UI). Pro/
  # Enterprise gated (plan_limits.vcs_cicd_enabled).
  pipelines:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-pipelines:latest
    environment:
      <<: *env-defaults
      PORT: "8017"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      # Origin Tier-3 CI/CD webhook URLs are built against (see
      # services/pipelines/connections.go's webhookBaseURL) -- without this,
      # a self-hosted install's generated webhook URLs silently point at
      # KubeWatch's own SaaS API gateway instead of this instance.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Tekton detailed-log fetches route through live-data's internal
      # pod-logs endpoint (this service has no cluster network access of
      # its own) -- see services/pipelines/logs.go's fetchTektonLog.
      LIVE_DATA_SERVICE_URL: "http://live-data:8009"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # VCS & CI/CD Observability Phase 2: verifies each provider's webhook
  # signature and forwards normalized events to live-data. Public-facing
  # (see the gateway's /webhooks/* route) but harmless/unused if no
  # connection ever enables a webhook — Tier 2 polling covers everything by
  # default (kubewatch-vcs-cicd/KUBEWATCH-VCS-CICD-OBSERVABILITY.md §4.1).
  webhook-gateway:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-webhook-gateway:latest
    environment:
      <<: *env-defaults
      PORT: "8018"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      LIVE_DATA_SERVICE_URL: http://live-data:8009
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Infrastructure Automation control-plane API — Projects/Vaults/Secrets/
  # Variables/Stacks/Runs CRUD, project-scoped RBAC, plan-gating, audit,
  # and run dispatch. IAC_VAULT_MASTER_KEY must be identical on this
  # service and iac-worker (install.sh generates one; rotating it later
  # means every previously-stored secret becomes permanently
  # undecryptable, so treat it like DB_PASSWORD/JWT_SECRET, not a value to
  # change casually).
  iac:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-iac:latest
    environment:
      <<: *env-defaults
      PORT: "8019"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
      VICTORIALOGS_URL: http://victorialogs:9428
      IAC_VAULT_MASTER_KEY: ${IAC_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # Credentials vault — stores login credentials (password/API key/SSH key)
  # encrypted at rest, shared with other users at a per-credential
  # viewer/operator/admin role. No tenant-facing worker like iac has; this
  # service is the whole feature.
  credentials:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-credentials:latest
    environment:
      <<: *env-defaults
      PORT: "8024"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      CREDENTIALS_VAULT_MASTER_KEY: ${CREDENTIALS_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Infrastructure Automation execution engine — runs tofu against
  # a project's Git-synced code. No tenant-facing API; dispatched via NATS
  # (fast path) plus a DB-polling fallback.
  iac-worker:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-iac-worker:latest
    environment:
      <<: *env-defaults
      PORT: "8020"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
      VICTORIALOGS_URL: http://victorialogs:9428
      IAC_VAULT_MASTER_KEY: ${IAC_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  cloud:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-cloud:latest
    environment:
      <<: *env-defaults
      PORT: "8010"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      LIVE_DATA_SERVICE_URL: http://live-data:8009
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # DataOps: ETL pipeline orchestration (AWS Glue/Step Functions today) and
  # broader multi-cloud resource inventory + lifecycle control (RDS/S3/Lambda
  # today). No plan-tier gate (deliberate product decision); only isAdmin
  # gates its write routes. See services/dataops/service.go.
  dataops:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-dataops:latest
    environment:
      <<: *env-defaults
      PORT: "8021"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Analytics: external Postgres/MySQL/Redshift/S3 connections, native
  # in-process data cleaning (expr-lang backed), size-bounded cleaned-
  # dataset storage for dashboarding. Credentials here are vault-encrypted
  # (ANALYTICS_VAULT_MASTER_KEY must be identical wherever this service
  # runs, generate with `openssl rand -base64 32`; without it the service
  # fails to start, matching IAC_VAULT_MASTER_KEY's own fail-closed
  # convention). No plan-tier gate (deliberate, matches dataops) -- only
  # isAdmin gates its write routes. Unrelated to the dataops service above:
  # dataops orchestrates AWS infrastructure, analytics reads and cleans a
  # customer's own data.
  analytics:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-analytics:latest
    environment:
      <<: *env-defaults
      PORT: "8022"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      ANALYTICS_VAULT_MASTER_KEY: ${ANALYTICS_VAULT_MASTER_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # AI DevOps Agent: bring-your-own-key LLM log diagnosis, triggered by
  # alerts.fire.* (same NATS consumer as remediation-engine above) or on
  # demand from the dashboard. Never executes anything itself -- a
  # resolvable, allowlisted suggestion becomes a row in
  # remediation_playbooks for remediation-engine to evaluate completely
  # unmodified. No plan-tier gate on diagnosis itself (deliberate, matches
  # analytics/dataops); autonomous execution reuses remediation's existing
  # Enterprise gate. DEVOPS_AGENT_VAULT_MASTER_KEY is required, generate
  # with `openssl rand -base64 32`; without it the service fails to start,
  # matching ANALYTICS_VAULT_MASTER_KEY's own fail-closed convention -- its
  # own key, never shared with analytics' or iac's.
  devops-agent:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-devops-agent:latest
    environment:
      <<: *env-defaults
      PORT: "8023"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
      NATS_URL: nats://nats:4222
      VICTORIALOGS_URL: http://victorialogs:9428
      DEVOPS_AGENT_VAULT_MASTER_KEY: ${DEVOPS_AGENT_VAULT_MASTER_KEY}
      DEVOPS_AGENT_MAX_DIAGNOSES_PER_HOUR: ${DEVOPS_AGENT_MAX_DIAGNOSES_PER_HOUR:-20}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  integrations:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-integrations:latest
    environment:
      <<: *env-defaults
      PORT: "8011"
      KUBEWATCH_MODE: ${KUBEWATCH_MODE:-selfhosted}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: ghcr.io/lloyd-theophilus/kubewatch-frontend:latest
    environment:
      API_BASE: http://gateway:8000
      NEXT_PUBLIC_MODE: selfhosted
      NEXT_PUBLIC_API_URL: http://${DOMAIN:-localhost}:8000
    restart: unless-stopped
    depends_on:
      - gateway

  postgres:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_DB: kubewatch
      POSTGRES_USER: kubewatch
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubewatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot schema migrator. Applies infra/migrations/*.sql (staged into
  # ./migrations by the deploy job) on every `up`.
  #
  # The migration files are in goose format (-- +goose Up / -- +goose Down).
  # psql does not understand those directives, so we strip everything from
  # "-- +goose Down" onward and apply only the Up section — otherwise psql
  # would run each Down block too and drop the tables it just created.
  # Up sections use CREATE TABLE/COLUMN IF NOT EXISTS and ON CONFLICT, so
  # re-running is safe. Services reading core tables wait for this to finish.
  migrate:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - |
        echo "Applying database migrations…"
        # A glob that matches nothing expands to its own literal pattern
        # string in sh (no nullglob here), so an empty/missing /migrations
        # directory would otherwise silently "succeed" with zero migrations
        # ever applied — sed would fail to open a file literally named
        # "/migrations/*.sql", but the `|| true` below swallows that,
        # masking what is actually a critical failure as "Migrations
        # complete.". Fail loudly instead: this always means the updater's
        # migrations refresh didn't run or didn't land where expected.
        set -- /migrations/*.sql
        if [ ! -e "$$1" ]; then
          echo "ERROR: no .sql files found in /migrations — refusing to report success. Check that ./migrations on the host is actually populated (see the updater container's own logs: docker logs kubewatch-updater)." >&2
          exit 1
        fi
        for f in /migrations/*.sql; do
          echo ">> applying $$f (Up only)"
          sed '/-- +goose Down/,$$d' "$$f" | psql -h postgres -U kubewatch -d kubewatch -v ON_ERROR_STOP=0 || true
        done
        echo "Migrations complete."
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Disaster recovery: scheduled Postgres backups pushed to one or more
  # configured destinations (BACKUP_DESTINATIONS, comma-separated: s3, sftp,
  # webhook, azure — an instance can push to just one, or several at once
  # for redundancy), each immediately followed by an automated restore test
  # (restores into a scratch database on this same Postgres server, never
  # the real "kubewatch" database, verifies a basic row count, then drops
  # it). Self-hosted only for now; SaaS's own platform-wide backups are an
  # operator-console concern, not something exposed per-org. If
  # BACKUP_DESTINATIONS isn't set, this just idles — no backups run, and
  # nothing else in the stack is affected.
  #
  # The manual "run backup now" trigger in services/query's Docker-Engine-API
  # code launches a one-off container running the same logic as below with
  # triggered_by=manual; keep the two in sync if this changes.
  backup:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: kubewatch
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: kubewatch
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # 0 (or unset) means "keep forever" -- backups are never pruned. A
      # positive value is the number of days a backup and its destination
      # copies (S3 object, SFTP file, Azure blob -- webhook has no generic
      # delete API and is left alone) are kept before the next scheduled
      # backup prunes it.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Comma-separated subset of: s3, sftp, webhook, azure. Empty disables
      # the feature entirely. Each kind's own env vars below only matter if
      # that kind is listed here.
      BACKUP_DESTINATIONS: ${BACKUP_DESTINATIONS:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_USE_SSL: ${BACKUP_S3_USE_SSL:-true}
      # SFTP: a dedicated, backup-only-scoped SSH key is strongly recommended
      # over reusing a general admin key. Host key verification is
      # trust-on-first-connect (accept-new), not pre-pinned — acceptable for
      # a destination you configured yourself, not a substitute for network
      # controls if that matters for your threat model.
      BACKUP_SFTP_HOST: ${BACKUP_SFTP_HOST:-}
      BACKUP_SFTP_PORT: ${BACKUP_SFTP_PORT:-22}
      BACKUP_SFTP_USER: ${BACKUP_SFTP_USER:-}
      BACKUP_SFTP_PATH: ${BACKUP_SFTP_PATH:-}
      BACKUP_SFTP_PRIVATE_KEY: ${BACKUP_SFTP_PRIVATE_KEY:-} # base64-encoded PEM private key
      # Generic webhook: the dump is POSTed as the raw request body.
      BACKUP_WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
      BACKUP_WEBHOOK_AUTH_HEADER: ${BACKUP_WEBHOOK_AUTH_HEADER:-} # e.g. "Bearer <token>", sent as Authorization
      # Azure Blob: a container-level SAS URL with write permission
      # (generate via the Azure Portal or `az storage container generate-sas`),
      # e.g. https://acct.blob.core.windows.net/container?sv=...&sig=... —
      # avoids implementing Azure's Shared-Key HMAC signing from scratch.
      BACKUP_AZURE_CONTAINER_SAS_URL: ${BACKUP_AZURE_CONTAINER_SAS_URL:-}
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$BACKUP_DESTINATIONS" ]; then
          echo "BACKUP_DESTINATIONS not set -- disaster recovery backups are disabled. Set this (and the matching destination env vars) to enable scheduled backups and restore tests."
          while true; do sleep 3600; done
        fi

        has_destination() {
          case ",$$BACKUP_DESTINATIONS," in
            *",$$1,"*) return 0 ;;
            *) return 1 ;;
          esac
        }

        if has_destination s3; then
          echo "==> installing mc (MinIO client, for the s3 destination)"
          wget -qO /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /usr/local/bin/mc
          SCHEME=https
          if [ "$$BACKUP_S3_USE_SSL" = "false" ]; then SCHEME=http; fi
          mc alias set dr "$$SCHEME://$$BACKUP_S3_ENDPOINT" "$$BACKUP_S3_ACCESS_KEY" "$$BACKUP_S3_SECRET_KEY" --api S3v4
        fi
        if has_destination sftp; then
          echo "==> installing openssh-client (for the sftp destination)"
          apk add --no-cache openssh-client >/dev/null
        fi

        record_destination() {
          # $$1=row id  $$2=backup id  $$3=kind  $$4=status  $$5=location  $$6=error
          psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
            "INSERT INTO dr_backup_destinations (id, backup_id, kind, status, location, error, completed_at) VALUES ('$$1', '$$2', '$$3', '$$4', '$$5', '$$6', NOW())" >/dev/null
        }

        push_s3() { mc cp "$$1" "dr/$$BACKUP_S3_BUCKET/$$2" >/dev/null 2>&1; }

        push_sftp() {
          key_file="/tmp/sftp_key_$$$$"
          echo "$$BACKUP_SFTP_PRIVATE_KEY" | base64 -d > "$$key_file" 2>/dev/null
          chmod 600 "$$key_file"
          # A single "put" piped in via stdin, rather than a heredoc — avoids
          # any risk of the heredoc terminator not matching once this script
          # is indented inside a YAML block scalar.
          echo "put $$1 $$BACKUP_SFTP_PATH/$$2" | sftp -i "$$key_file" -P "$$BACKUP_SFTP_PORT" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$$BACKUP_SFTP_USER@$$BACKUP_SFTP_HOST" >/dev/null 2>&1
          rc=$$?
          rm -f "$$key_file"
          return $$rc
        }

        push_webhook() {
          # Branches instead of building an optional flag into a variable and
          # leaving it unquoted — an unquoted "--header=...: value" variable
          # would word-split on its embedded space/colon and mangle the flag.
          if [ -n "$$BACKUP_WEBHOOK_AUTH_HEADER" ]; then
            wget -q --method=POST --body-file="$$1" \
              --header="Authorization: $$BACKUP_WEBHOOK_AUTH_HEADER" \
              --header="Content-Type: application/octet-stream" --header="X-Backup-Filename: $$2" \
              -O /dev/null "$$BACKUP_WEBHOOK_URL" >/dev/null 2>&1
          else
            wget -q --method=POST --body-file="$$1" \
              --header="Content-Type: application/octet-stream" --header="X-Backup-Filename: $$2" \
              -O /dev/null "$$BACKUP_WEBHOOK_URL" >/dev/null 2>&1
          fi
        }

        push_azure() {
          base="$${BACKUP_AZURE_CONTAINER_SAS_URL%%\?*}"
          query="$${BACKUP_AZURE_CONTAINER_SAS_URL#*\?}"
          wget -q --method=PUT --body-file="$$1" \
            --header="x-ms-blob-type: BlockBlob" --header="Content-Type: application/octet-stream" \
            -O /dev/null "$$base/$$2?$$query" >/dev/null 2>&1
        }

        delete_s3() { mc rm "dr/$$BACKUP_S3_BUCKET/$$1" >/dev/null 2>&1; }

        delete_sftp() {
          key_file="/tmp/sftp_key_$$$$"
          echo "$$BACKUP_SFTP_PRIVATE_KEY" | base64 -d > "$$key_file" 2>/dev/null
          chmod 600 "$$key_file"
          echo "rm $$1" | sftp -i "$$key_file" -P "$$BACKUP_SFTP_PORT" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$$BACKUP_SFTP_USER@$$BACKUP_SFTP_HOST" >/dev/null 2>&1
          rc=$$?
          rm -f "$$key_file"
          return $$rc
        }

        delete_azure() {
          base="$${BACKUP_AZURE_CONTAINER_SAS_URL%%\?*}"
          query="$${BACKUP_AZURE_CONTAINER_SAS_URL#*\?}"
          wget -q --method=DELETE -O /dev/null "$$base/$$1?$$query" >/dev/null 2>&1
        }

        # Prunes backups (and their destination copies) older than
        # BACKUP_RETENTION_DAYS -- empty or non-positive means "keep
        # forever," never prune. Best-effort per destination: a delete
        # call's exit status is deliberately ignored rather than blocking
        # the dr_backups row's own deletion below -- a stale row pointing
        # at an already-gone-or-undeletable file is worse than a file
        # outliving its DB record by one cycle. webhook has no generic
        # delete API, so it's skipped entirely -- nothing to call.
        #
        # delete_s3/delete_sftp/delete_azure target wherever
        # BACKUP_S3_BUCKET/BACKUP_SFTP_HOST/BACKUP_AZURE_CONTAINER_SAS_URL
        # point RIGHT NOW, not a snapshot of what was configured when that
        # specific backup was originally pushed -- if a destination is
        # reconfigured between backups, older backups at the old location
        # become permanently un-prunable (silently orphaned) rather than
        # erroring. Accepted: this mirrors the push side's own existing
        # behavior, not something retention introduces.
        prune_old_backups() {
          retention="$${BACKUP_RETENTION_DAYS:-0}"
          case "$$retention" in
            ''|*[!0-9]*) return 0 ;;
          esac
          [ "$$retention" -le 0 ] && return 0

          old_ids=$$(psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -t -A -c \
            "SELECT id FROM dr_backups WHERE started_at < NOW() - INTERVAL '$$retention days'" 2>/dev/null)
          [ -z "$$old_ids" ] && return 0

          for prune_id in $$old_ids; do
            psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -t -A -F'|' -c \
              "SELECT kind, location FROM dr_backup_destinations WHERE backup_id='$$prune_id' AND status='success' AND location IS NOT NULL" 2>/dev/null |
            while IFS='|' read -r prune_kind prune_location; do
              [ -z "$$prune_location" ] && continue
              case "$$prune_kind" in
                s3) delete_s3 "$$prune_location" ;;
                sftp) delete_sftp "$$prune_location" ;;
                azure) delete_azure "$$prune_location" ;;
                *) : ;;
              esac
            done
            psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c "DELETE FROM dr_backups WHERE id='$$prune_id'" >/dev/null 2>&1
          done
        }

        # Pushes to every configured destination, recording one
        # dr_backup_destinations row per attempt. Returns success (0) if at
        # least one destination succeeded.
        push_all_destinations() {
          backup_id="$$1"
          dump_file="$$2"
          any_ok=1
          saved_ifs="$$IFS"
          IFS=','
          set -- $$BACKUP_DESTINATIONS
          IFS="$$saved_ifs"
          for dest in "$$@"; do
            dest=$$(echo "$$dest" | tr -d ' ')
            [ -z "$$dest" ] && continue
            row_id="drd_$$(date +%s)_$$$$_$$dest"
            name="$${backup_id}.dump"
            case "$$dest" in
              s3)
                key="backups/$$name"
                if push_s3 "$$dump_file" "$$key"; then
                  record_destination "$$row_id" "$$backup_id" "s3" "success" "$$key" ""; any_ok=0
                else
                  record_destination "$$row_id" "$$backup_id" "s3" "failed" "" "upload failed"
                fi ;;
              sftp)
                if push_sftp "$$dump_file" "$$name"; then
                  record_destination "$$row_id" "$$backup_id" "sftp" "success" "$$BACKUP_SFTP_PATH/$$name" ""; any_ok=0
                else
                  record_destination "$$row_id" "$$backup_id" "sftp" "failed" "" "sftp upload failed"
                fi ;;
              webhook)
                if push_webhook "$$dump_file" "$$name"; then
                  record_destination "$$row_id" "$$backup_id" "webhook" "success" "$$BACKUP_WEBHOOK_URL" ""; any_ok=0
                else
                  record_destination "$$row_id" "$$backup_id" "webhook" "failed" "" "webhook post failed"
                fi ;;
              azure)
                if push_azure "$$dump_file" "$$name"; then
                  record_destination "$$row_id" "$$backup_id" "azure" "success" "$$name" ""; any_ok=0
                else
                  record_destination "$$row_id" "$$backup_id" "azure" "failed" "" "azure upload failed"
                fi ;;
              *)
                echo "unknown BACKUP_DESTINATIONS entry: $$dest" >&2 ;;
            esac
          done
          return $$any_ok
        }

        run_restore_test() {
          backup_id="$$1"
          dump_file="$$2"
          test_id="rt_$$(date +%s)_$$$$"
          scratch_db="dr_test_$$(date +%s)"
          psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO dr_restore_tests (id, backup_id, status) VALUES ('$$test_id', '$$backup_id', 'running')"

          if psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $$scratch_db" \
             && pg_restore -h "$$PGHOST" -U "$$PGUSER" -d "$$scratch_db" --format=custom "$$dump_file"; then
            org_count=$$(psql -h "$$PGHOST" -U "$$PGUSER" -d "$$scratch_db" -t -A -c "SELECT COUNT(*) FROM organizations" 2>/dev/null)
            if [ -n "$$org_count" ]; then
              psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
                "UPDATE dr_restore_tests SET status='passed', completed_at=NOW(), verified_org_count=$$org_count WHERE id='$$test_id'"
            else
              psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
                "UPDATE dr_restore_tests SET status='failed', completed_at=NOW(), error='verification query failed' WHERE id='$$test_id'"
            fi
          else
            psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
              "UPDATE dr_restore_tests SET status='failed', completed_at=NOW(), error='restore failed' WHERE id='$$test_id'"
          fi
          # Always drop the scratch database, even if restore/verify failed partway.
          psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c "DROP DATABASE IF EXISTS $$scratch_db" >/dev/null 2>&1 || true
        }

        run_backup() {
          triggered_by="$${1:-scheduled}"
          id="bkp_$$(date +%s)_$$$$"
          psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO dr_backups (id, status, triggered_by) VALUES ('$$id', 'running', '$$triggered_by')"

          dump_file="/tmp/$${id}.dump"
          if pg_dump -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" --format=custom --compress=9 -f "$$dump_file"; then
            size=$$(stat -c %s "$$dump_file")
            if push_all_destinations "$$id" "$$dump_file"; then
              psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
                "UPDATE dr_backups SET status='success', completed_at=NOW(), size_bytes=$$size WHERE id='$$id'"
              run_restore_test "$$id" "$$dump_file"
            else
              psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
                "UPDATE dr_backups SET status='failed', completed_at=NOW(), size_bytes=$$size, error='all configured destinations failed' WHERE id='$$id'"
            fi
          else
            psql -h "$$PGHOST" -U "$$PGUSER" -d "$$PGDATABASE" -c \
              "UPDATE dr_backups SET status='failed', completed_at=NOW(), error='pg_dump failed' WHERE id='$$id'"
          fi
          prune_old_backups
          rm -f "$$dump_file"
        }

        echo "==> disaster-recovery backup loop starting (interval=$${BACKUP_INTERVAL_SECONDS}s, destinations=$$BACKUP_DESTINATIONS)"
        while true; do
          run_backup scheduled
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  victoriametrics:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: victoriametrics/victoria-metrics:latest
    command:
      - -retentionPeriod=365d
      - -storageDataPath=/victoria-metrics-data
    volumes:
      - vm_data:/victoria-metrics-data
    restart: unless-stopped

  # Log-oriented sibling of victoriametrics above: holds AI agent spans and
  # continuously-collected container/pod logs (see services/ingestion's
  # startBulkLogsWriter and startTSDBWriter). Present in the local dev
  # compose since these features were built, but missing here until now —
  # ingestion/query fall back to this exact hostname when VICTORIALOGS_URL
  # isn't set, so without this service those features 500 on every request.
  victorialogs:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: victoriametrics/victoria-logs:latest
    command:
      # 90d so the Pod/Container detail pages' longest log-history range
      # option isn't decorative — bumped from 30d alongside those pages.
      - -retentionPeriod=90d
      - -storageDataPath=/victoria-logs-data
    volumes:
      - vl_data:/victoria-logs-data
    restart: unless-stopped

  nats:
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    image: public.ecr.aws/docker/library/nats:2-alpine
    # -m enables the HTTP monitoring port used by the healthcheck below —
    # without a healthcheck, `depends_on: condition: service_started` only
    # waits for the process to start, not for NATS to actually accept
    # connections. On a fresh `up -d`, dependents can start (and give up
    # connecting) before NATS is ready, silently breaking the metrics
    # pipeline until manually restarted — see live-data's NATS connection
    # comment for how it degrades instead of crashing.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - nats_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  vm_data:
  vl_data:
  nats_data:
  caddy_data:
  gateway_data:
